<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1c38" />
      <stop offset="100%" stop-color="#01050e" />
    </radialGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#0066FF" stroke-width="2.5" filter="url(#blueGlow)" />
  <text x="32" y="39" fill="#ffffff" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.5">FA</text>
</svg>
